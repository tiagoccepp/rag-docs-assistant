services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: ragdocs-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rag:ragpassword@postgres:5432/ragdocs
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
