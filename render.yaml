# Render Blueprint: one-click deploy (free tier OK). Paste your LLM key once
# in the Render dashboard when prompted (OPENAI_API_KEY); everything else
# is preconfigured. See docs/DEPLOY.md.
services:
  - type: web
    name: rag-docs-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://opencode.ai/zen/go/v1
      - key: OPENAI_CHAT_MODEL
        value: beam-free
      - key: OPENCODE_SESSION_ID
        value: render-prod
      - key: DISABLE_INGEST
        value: "1"
